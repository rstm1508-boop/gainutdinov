<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>    
                // Создаём объекты мест работы
        const job1 = {
            company: "ООО Ромашка",
            position: "Менеджер",
            startYear: 2015,
            endYear: 2018
        };

        const job2 = {
            company: "АО ТехноПлюс",
            position: "Разработчик",
            startYear: 2018,
            endYear: 2022
        };

        const job3 = {
            company: "ООО Ромашка",
            position: "Старший менеджер",
            startYear: 2022,
            endYear: 2024
        };

        // Создаём объект "Человек"
        const person = {
            surname: "Иванов",
            name: "Иван",
            patronymic: "Иванович",
            birthYear: 1990,
            workPlaces: [job1, job2, job3]
        };

        // Блокируем поля, которые редко изменяются
        Object.defineProperty(person, "surname", {
            writable: false
        });

        Object.defineProperty(person, "name", {
            writable: false
        });

        Object.defineProperty(person, "patronymic", {
            writable: false
        });

        Object.defineProperty(person, "birthYear", {
            writable: false
        });

        // Проверка блокировки
        person.name = "Пётр"; // Изменение не произойдёт

        // Вывод объекта
        console.log(person);


    </script>
    
</body>
</html>
