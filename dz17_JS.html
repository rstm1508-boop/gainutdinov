<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма отправки данных</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .user-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 350px;
    }

    input,
    select,
    textarea,
    button {
      padding: 8px;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .message {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <form class="user-form">

    <input
      type="text"
      name="name"
      class="name-input"
      placeholder="Введите имя"
    >

    <input
      type="email"
      name="email"
      class="email-input"
      placeholder="Введите email"
      required
    >

    <select name="country" class="country-select">
      <option value="Россия">Россия</option>
      <option value="Германия">Германия</option>
      <option value="Франция">Франция</option>
    </select>

    <textarea
      name="comment"
      class="comment-textarea"
      placeholder="Введите комментарий"
    ></textarea>

    <button type="submit">
      Отправить
    </button>

    <p class="message"></p>

  </form>

  <script>
    const userForm = document.querySelector(".user-form");
    const message = document.querySelector(".message");

    userForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const formData = new FormData(userForm);

      const name = formData.get("name").trim();
      const email = formData.get("email").trim();

      // Валидация
      if (name === "") {
        message.textContent = "Ошибка: введите имя.";
        console.log("Имя не заполнено");
        return;
      }

      if (email === "") {
        message.textContent = "Ошибка: введите email.";
        console.log("Email не заполнен");
        return;
      }

      // Преобразование FormData в объект
      const userData = Object.fromEntries(formData.entries());

      console.log("Данные формы:", userData);

      try {
        // Тестовый сервер
        const response = await fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(userData)
        });

        const result = await response.json();

        console.log("Ответ сервера:", result);

        message.textContent = "Данные успешно отправлены!";

        userForm.reset();

      } catch (error) {
        console.error("Ошибка отправки:", error);
        message.textContent = "Произошла ошибка при отправке.";
      }
    });
  </script>

</body>
</html>
